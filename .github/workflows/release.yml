name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build
      - name: Upload installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated" }

          if ($env:GITHUB_REF -like "refs/tags/v*") {
            gh release create $env:GITHUB_REF_NAME $installer.FullName --verify-tag --generate-notes --title $env:GITHUB_REF_NAME
            exit
          }

          git tag --force nightly $env:GITHUB_SHA
          git push --force origin refs/tags/nightly
          gh release view nightly *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create nightly --verify-tag --prerelease --title "Nightly" --notes "由 main 分支最新代码自动构建。"
          }
          gh release upload nightly $installer.FullName --clobber
